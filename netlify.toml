# Konfigurasi Netlify
# Situs statis tanpa build step — index.html dilayani langsung dari root.

[build]
  publish = "."

# Mematikan Netlify Drawer/Snippet Injection pada semua lingkungan deploy
[build.environment]
  NETLIFY_NEXT_DROP_INJECT_DRAWER = "false"

[context.production.environment]
  NETLIFY_NEXT_DROP_INJECT_DRAWER = "false"
